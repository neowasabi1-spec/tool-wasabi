[build]
  command = "npm run build"
  # Forziamo .next perché esiste un override "fantasma" salvato lato UI Netlify
  # (publishOrigin: ui che punta a /opt/build/repo) che il pannello non mostra.
  # Con publish qui in netlify.toml, il toml batte la UI.
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=6144"

# Default per TUTTE le Netlify Functions generate da @netlify/plugin-nextjs.
# Il plugin avvolge ogni route Next.js in una unica function chiamata
# `___netlify-server-handler`. Senza questi due pezzi:
# - external_node_modules: @sparticuz/chromium-min e playwright-core
#   restano fuori dal bundle (richiesto perché serverComponentsExternalPackages
#   in next.config.js li tratta come "external" lato Next, ma Netlify
#   ha la sua propria fase di bundling con esbuild che li toglie).
# - included_files: forza l'inclusione del codice JS di chromium-min nel
#   working directory della function (il binario Chromium NON viene
#   bundleato, viene scaricato a runtime dal remote tar URL).
# NB: ffmpeg va SOLO nelle due function video qui sotto — se messo qui nel
# blocco globale "*" finisce anche nel server handler (già enorme con
# chromium) e sfora il limite di 250 MB.
[functions]
  external_node_modules = ["@sparticuz/chromium-min", "playwright-core"]
  included_files = ["node_modules/@sparticuz/chromium-min/**"]

# Override timeout solo per la function unica del Next adapter, così le
# route con maxDuration alto (clone/swipe/checkpoint/diagnose-fetch) hanno
# spazio per scaricare Chromium + lanciarlo + navigare. 300s = soffitto
# Netlify Pro. La route swipe ha `export const maxDuration = 300`, quindi
# se il tetto qui fosse più basso (es. 120) Netlify ucciderebbe la
# function a metà generazione e il client riceverebbe HTML 504 (causa
# del classico "Unexpected token '<'" nel parser JSON del frontend).
[functions."___netlify-server-handler"]
  timeout = 300

# ffmpeg SOLO per le background function video (~79 MB, un solo binario).
# NB: niente ffprobe-static — spedisce i binari di TUTTI gli OS (~335 MB) e
# sforerebbe i 250 MB. Durata/dimensioni si leggono parsando `ffmpeg -i`.
[functions."segment-video-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/ffmpeg"]

[functions."build-video-background"]
  external_node_modules = ["ffmpeg-static"]
  # caption.ttf è il font passato a libass per il burn dei sottotitoli: senza un
  # font nel bundle il runtime Lambda non ne ha nessuno e le scritte non vengono
  # disegnate (libass fallisce in silenzio → video senza sottotitoli).
  included_files = ["node_modules/ffmpeg-static/ffmpeg", "netlify/functions/_assets/**"]

# Localizza un video esistente (voiceover + sottotitoli tradotti sul filmato
# originale): stesse dipendenze del build (ffmpeg + font per libass).
[functions."localize-video-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/ffmpeg", "netlify/functions/_assets/**"]

# ffmpeg serve per estrarre i frame di controllo tra un passaggio di pulizia
# e l'altro (verifica se è rimasto del testo).
[functions."inpaint-shot-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = ["node_modules/ffmpeg-static/ffmpeg"]

# Autopilot pipeline: la background function esegue le chiamate AI DIRETTAMENTE
# (non richiama più la route Next internamente, perché Netlify taglia le
# chiamate funzione→funzione a ~26s). Le servono i file della Knowledge Base
# di copywriting a runtime, quindi li includiamo nel bundle.
[functions."pipeline-run-background"]
  included_files = ["src/knowledge/copywriting/raw/**"]

# Diagnostic endpoint to confirm the KB loads inside a function bundle.
[functions."kb-check"]
  included_files = ["src/knowledge/copywriting/raw/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
